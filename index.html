<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Huddle landing page with single introductory section</title>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/935f6be249.js" crossorigin="anonymous"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kumbh+Sans:wght@100..900&family=Lexend+Deca:wght@100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <main class="huddle">

    <header class="huddle__header">

      <img src="images/logo.svg" class="header__logo" alt="Huddle logo">

    </header>

    <section class="huddle__hero">

      <picture class="hero__background">
        <source srcset="images/bg-mobile.svg" media="(max-width: 375px)">
        <source srcset="images/bg-desktop.svg" media="(max-width: 1440px)">
        <img src="images/bg-desktop.svg" class="background__img" alt="" aria-hidden="true">
      </picture>

      <img src="images/illustration-mockups.svg" class="hero__mockup" alt="illustration mockup of the ui">

      <div class="hero__content">
        <h1 class="hero__title">
          Build The Community Your Fans Will Love
        </h1>

        <p class="hero__text">
          Huddle re-imagines the way we build communities. You have a voice, but so does your audience.
          Create connections with your users as you engage in genuine discussion.
        </p>

        <button class="hero__btn">
          Register
        </button>
      </div>

    </section>

    <footer class="huddle__footer">
      <ul class="footer__socials">
        <li><a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f footer__icon"></i></a></li>
        <li><a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter footer__icon"></i></a></li>
        <li><a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram footer__icon"></i></a></li>
      </ul>
    </footer>

  </main>


</body>

</html>
